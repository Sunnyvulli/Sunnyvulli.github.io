name: Portfolio verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evaluation dependencies
        run: python -m pip install -r projects/mobility-quality/requirements.txt -r requirements-dev.txt
      - name: Check formatting
        run: make format-check
      - name: Run isolated smoke demo
        run: make run
      - name: Run pipeline and system tests
        working-directory: projects/mobility-quality
        run: |
          python pipeline.py
          python -m unittest -v
      - name: Reproduce evaluation
        working-directory: projects/mobility-quality
        run: python evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-evaluation
          path: projects/mobility-quality/results/
