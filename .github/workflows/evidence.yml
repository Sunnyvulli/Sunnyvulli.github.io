name: Test portfolio evidence
on:
  push:
    paths: ['evidence/**', '.github/workflows/evidence.yml']
  pull_request:
    paths: ['evidence/**', '.github/workflows/evidence.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s evidence/data-quality -v
