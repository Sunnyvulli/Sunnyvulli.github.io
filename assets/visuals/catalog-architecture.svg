<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Catalog Sentinel</title><rect width="800" height="460" fill="#090d16"/><g font-family="system-ui,sans-serif" fill="#edf4ff"><path d="M44 42h48" stroke="#38bdf8" stroke-width="4"/><text x="44" y="94" font-size="36" font-weight="700">Catalog Sentinel</text><text x="44" y="129" font-size="21" fill="#aebbd0">Local read-only MCP architecture</text><rect x="44" y="151" width="712" height="70" rx="12" fill="#111827" stroke="#31445e"/><text x="64" y="192" font-size="23" fill="#38bdf8">01</text><text x="122" y="180" font-size="23">Host assigns a role</text><text x="122" y="206" font-size="18" fill="#aebbd0">Permissions set at launch</text><rect x="44" y="233" width="712" height="70" rx="12" fill="#111827" stroke="#31445e"/><text x="64" y="274" font-size="23" fill="#38bdf8">02</text><text x="122" y="262" font-size="23">Server checks the request</text><text x="122" y="288" font-size="18" fill="#aebbd0">Allowlisted handlers, schema checks and audit logging</text><rect x="44" y="315" width="712" height="70" rx="12" fill="#111827" stroke="#31445e"/><text x="64" y="356" font-size="23" fill="#38bdf8">03</text><text x="122" y="344" font-size="23">SQLite returns approved data</text><text x="122" y="370" font-size="18" fill="#aebbd0">Bounded aggregate reads</text><text x="44" y="421" font-size="18" fill="#aebbd0">Local stdio prototype · remote authentication outside scope</text></g></svg>